name: Crowdamp
description: 'Crowdamp is a privately held Lightspeed Venture Partners portfolio company
  co-founded by Ruben Mayer-Hirshfeld and Alexandra Botez. The company built SuperFan,
  a creator-economy messaging product that let fans text their favorite social media
  stars and receive a personalized reply, using natural language processing to help
  those creators respond efficiently at scale across their whole audience. As of the
  July 2026 enrichment pass Crowdamp publishes no developer surface of any kind: there
  is no developer portal, no documentation, no API reference, no OpenAPI or other machine-readable
  specification, no SDK packages in any public registry, and no working product website.
  The SuperFan domain superfanapp.com no longer resolves to the product and is listed
  for sale through a domain reseller, indicating the product is no longer operating.
  This profile is retained as a portfolio-graph record rather than as an API provider.'
